<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French: The Westminster Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#F3EFE6;
    --paper-alt:#EAE3D2;
    --panel:#FBF9F3;
    --ink:#211E1A;
    --ink-soft:#5B5348;
    --rouge:#AE2530;
    --rouge-dark:#821A22;
    --navy:#1C2B3A;
    --navy-light:#2E4258;
    --gold:#A2802E;
    --green:#3C6B48;
    --green-bg:#E4EEE3;
    --red-bg:#F5E2DF;
    --line:rgba(33,30,26,0.16);
    --line-soft:rgba(33,30,26,0.09);
    --serif:'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    display:flex;
    min-height:100vh;
  }
  ::selection{background:var(--rouge);color:#fff;}
  a{color:var(--rouge-dark);}
  button{font-family:inherit;cursor:pointer;}
  @media (prefers-reduced-motion: no-preference){
    .nav-item, .opt, .btn, .dot{transition:all .15s ease;}
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--navy);
    color:var(--paper);
    width:280px;
    flex-shrink:0;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    padding:28px 0 20px;
    border-right:1px solid rgba(0,0,0,0.25);
  }
  .brand{
    padding:0 24px 20px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:14px;
  }
  .home-back{display:inline-block;margin-bottom:10px;font-size:12.5px;color:#B9C3CE;text-decoration:none;}
  .home-back:hover{color:#fff;text-decoration:underline;}
  .brand-title{
    font-family:var(--serif);
    font-weight:600;
    font-style:italic;
    font-size:21px;
    line-height:1.25;
    letter-spacing:0.1px;
    margin:0;
    color:#fff;
  }
  .brand-sub{
    font-size:12.5px;
    color:#B9C3CE;
    margin:6px 0 0;
    line-height:1.4;
  }
  .owner-badge{
    display:inline-block;
    margin:10px 0 0;
    font-size:11.5px;
    color:#CDE8D2;
    background:rgba(95,169,110,0.18);
    border:1px solid rgba(95,169,110,0.45);
    border-radius:20px;
    padding:2px 10px;
  }
  .owner-badge[hidden], .account-link[hidden], .login-form[hidden], .login-error[hidden]{display:none;}
  .account{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;}
  .account .owner-badge{margin:0;}
  .account-link{background:none;border:none;padding:0;color:#B9C3CE;font-size:12.5px;text-decoration:underline;}
  .account-link:hover{color:#fff;}

  /* ---------- Sign-in gate: nothing else shows until the course is unlocked ---------- */
  body.locked .sidebar, body.locked .main{display:none;}
  .gate{
    position:fixed;inset:0;z-index:50;
    display:grid;place-items:center;padding:16px;
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-light) 100%);
  }
  .gate[hidden]{display:none;}
  .gate-card{
    width:min(380px, 100%);
    background:var(--panel);
    color:var(--ink);
    border-radius:10px;
    padding:28px 26px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,0.35);
    transition:opacity .25s ease;
  }
  .gate-card.pending{opacity:0;pointer-events:none;}
  .gate-flag{display:flex;height:5px;width:54px;border-radius:2px;overflow:hidden;margin-bottom:16px;}
  .gate-flag span{flex:1;}
  .gate-title{
    font-family:var(--serif);font-style:italic;font-weight:600;
    font-size:26px;line-height:1.15;margin:0 0 4px;color:var(--navy);
  }
  .gate-sub{margin:0 0 20px;font-size:14px;color:var(--ink-soft);}
  .gate-form{display:grid;gap:12px;}
  .gate-form label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--ink-soft);}
  .gate-form input{
    width:100%;padding:10px 12px;font:inherit;font-size:16px;
    border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);
  }
  .gate-form input:focus-visible{outline:2px solid var(--rouge);outline-offset:1px;}
  .gate-form .btn{justify-content:center;margin-top:4px;padding:12px;}
  .gate-form .btn[disabled]{opacity:.7;cursor:wait;}
  .gate-error{margin:0;font-size:13.5px;color:var(--rouge-dark);}
  .gate-error[hidden]{display:none;}
  @media (max-width: 600px){
    .gate-card{padding:22px 20px 18px;}
    .gate-title{font-size:22px;}
  }
  .nav-group-label{
    padding:14px 24px 6px;
    font-size:11.5px;
    color:#8394A4;
    font-weight:500;
  }
  .nav-item{
    width:100%;
    background:none;
    border:none;
    color:#DCE3EA;
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 24px;
    text-align:left;
    font-size:14.5px;
    text-decoration:none;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);}
  .boot{text-align:center;margin:40vh auto 0;color:var(--ink-soft);font-size:14px;}
  .nav-item.active{
    background:rgba(174,37,48,0.22);
    box-shadow:inset 3px 0 0 var(--rouge);
    color:#fff;
  }
  .nav-num{
    font-family:var(--serif);
    font-size:15px;
    color:#8394A4;
    width:18px;
    flex-shrink:0;
  }
  .nav-item.active .nav-num{color:#F0B9BD;}
  .nav-text{flex:1;min-width:0;}
  .nav-fr{display:block;font-weight:500;}
  .nav-en{display:block;font-size:11.5px;color:#8394A4;}
  .dot{
    width:9px;height:9px;border-radius:50%;flex-shrink:0;
    border:1.5px solid #6B7A8A;
    background:transparent;
  }
  .dot[data-status="partial"]{background:var(--gold);border-color:var(--gold);}
  .dot[data-status="low"]{background:var(--gold);border-color:var(--gold);}
  .dot[data-status="high"]{background:#5FA96E;border-color:#5FA96E;}

  /* ---------- Main content ---------- */
  .main{flex:1;min-width:0;display:flex;justify-content:center;}
  .content{
    width:100%;
    max-width:760px;
    padding:56px 32px 100px;
  }
  .home-hero h1{
    font-family:var(--serif);
    font-style:italic;
    font-weight:600;
    font-size:44px;
    line-height:1.15;
    margin:0 0 10px;
    color:var(--navy);
  }
  .home-hero .lede{
    font-size:17px;
    color:var(--ink-soft);
    max-width:56ch;
    margin:0 0 28px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--rouge);
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:4px;
    font-size:15px;
    font-weight:500;
  }
  .btn:hover{background:var(--rouge-dark);}
  .btn:focus-visible, .nav-item:focus-visible, .opt:focus-visible{
    outline:2px solid var(--rouge);
    outline-offset:2px;
  }
  .btn.secondary{
    background:transparent;
    color:var(--navy);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{background:var(--paper-alt);}

  .progress-summary{
    margin-top:44px;
    border-top:1px solid var(--line);
    padding-top:24px;
  }
  .progress-summary h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:20px;
    margin:0 0 4px;
  }
  .progress-summary .count{color:var(--ink-soft);font-size:14px;margin:0 0 16px;}
  .progress-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
  }
  .progress-card{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:4px;
    padding:10px 12px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .progress-card a{color:var(--ink);font-size:13px;flex:1;text-decoration:none;}
  .progress-card a:hover{text-decoration:underline;}

  /* module header */
  .mod-eyebrow{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:6px;
  }
  .mod-num{
    font-family:var(--serif);
    font-size:15px;
    color:var(--rouge);
    border-bottom:2px solid var(--rouge);
    padding-bottom:2px;
  }
  .mod-titleEn{font-size:14px;color:var(--ink-soft);}
  h1.mod-title{
    font-family:var(--serif);
    font-weight:600;
    font-size:38px;
    margin:0 0 18px;
    color:var(--navy);
  }
  .section-label{
    font-family:var(--serif);
    font-style:italic;
    font-size:19px;
    color:var(--navy);
    margin:36px 0 12px;
  }
  .teach-flow{margin:0 0 26px;max-width:68ch;}
  .teach-point{
    font-size:16px;
    line-height:1.75;
    margin:0 0 16px;
    color:var(--ink);
  }
  .teach-point .lead{font-weight:600;}
  .teach-point.rule .lead{color:var(--navy);}
  .teach-point.watch .lead{color:var(--rouge-dark);}
  .teach-point.tip .lead{color:var(--gold);}
  .teach-point code, p code{
    background:var(--paper-alt);
    padding:1px 5px;
    border-radius:3px;
    font-family:var(--sans);
    font-style:normal;
    font-size:0.92em;
  }
  .examples{list-style:none;margin:0;padding:0;}
  .examples li{
    padding:10px 0 10px 16px;
    border-left:3px solid var(--paper-alt);
    margin-bottom:6px;
  }
  .ex-fr{font-size:15.5px;}
  .ex-en{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}

  /* quiz */
  .quiz-q{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:6px;
    padding:18px 20px;
    margin-bottom:16px;
  }
  .quiz-q .prompt{font-size:15.5px;margin:0 0 12px;font-weight:500;}
  .opts{display:grid;gap:8px;}
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
    padding:9px 14px;
    font-size:14.5px;
    color:var(--ink);
  }
  .opt:hover:not([disabled]){border-color:var(--gold);}
  .opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:500;}
  .opt.incorrect{background:var(--red-bg);border-color:var(--rouge);color:var(--rouge-dark);}
  .opt[disabled]{cursor:default;}
  .feedback{margin-top:12px;font-size:14px;padding-top:10px;border-top:1px solid var(--line-soft);}
  .feedback .verdict{font-weight:600;margin-right:4px;}
  .feedback.ok .verdict{color:var(--green);}
  .feedback.no .verdict{color:var(--rouge-dark);}
  .quiz-score{font-size:13.5px;color:var(--ink-soft);margin:6px 0 18px;}

  /* challenge / extension blocks */
  .challenge-block{
    border:1.5px dashed var(--rouge);
    border-radius:6px;
    padding:18px 20px;
    margin-bottom:16px;
    background:rgba(174,37,48,0.045);
  }
  .challenge-tag{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    color:var(--rouge-dark);
    border:1px solid var(--rouge);
    border-radius:20px;
    padding:2px 10px;
    margin-bottom:10px;
  }
  .challenge-tag.extension{color:var(--gold);border-color:var(--gold);}
  .challenge-prompt{font-size:15px;margin:0 0 10px;}
  .challenge-answer{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:14.5px;}
  .challenge-answer .ans-fr{font-weight:500;}
  .challenge-note{font-size:13px;color:var(--ink-soft);margin-top:6px;}

  /* reference tables */
  .table-wrap{overflow-x:auto;margin:14px 0 22px;border:1px solid var(--line);border-radius:6px;}
  table.ref-table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);}
  table.ref-table caption{
    text-align:left;
    font-family:var(--serif);
    font-style:italic;
    font-size:15px;
    color:var(--navy);
    padding:10px 14px 8px;
    caption-side:top;
  }
  table.ref-table th, table.ref-table td{
    border-bottom:1px solid var(--line-soft);
    border-right:1px solid var(--line-soft);
    padding:7px 12px;
    text-align:left;
    white-space:nowrap;
  }
  table.ref-table th:last-child, table.ref-table td:last-child{border-right:none;}
  table.ref-table thead th{
    background:var(--paper-alt);
    font-weight:600;
    color:var(--navy);
  }
  table.ref-table tbody th{
    font-style:italic;
    color:var(--ink-soft);
    font-weight:400;
    background:var(--paper-alt);
  }
  .learn-then-quiz{font-size:13.5px;color:var(--ink-soft);margin:4px 0 14px;max-width:60ch;}
  .table-note{font-size:13px;color:var(--ink-soft);margin:-14px 0 22px;font-style:italic;}

  /* vocabulary round-up */
  .vocab-section{
    margin-top:44px;
    border-top:1px solid var(--line);
    padding-top:24px;
  }
  .vocab-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:8px;
  }
  .vocab-item{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:4px;
    padding:8px 12px;
  }
  .vocab-group{font-weight:600;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px;}
  .vocab-fr{font-weight:600;font-size:14px;}
  .vocab-en{color:var(--ink-soft);font-size:12.5px;margin-top:1px;}

  /* dictation */
  .dictee-item{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:6px;
    padding:18px 20px;
    margin-bottom:16px;
  }
  .dictee-controls{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  textarea.dictee-input{
    width:100%;
    min-height:56px;
    font-family:var(--sans);
    font-size:14.5px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper);
    color:var(--ink);
    resize:vertical;
  }
  .dictee-result{margin-top:12px;font-size:14px;}
  .diff-word{padding:0 2px;}
  .diff-word.match{color:var(--green);}
  .diff-word.miss{color:var(--rouge-dark);text-decoration:underline;text-decoration-style:dotted;}
  .correct-sentence{margin-top:8px;font-style:italic;color:var(--ink-soft);}

  .writing-box{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:6px;
    padding:18px 20px;
    margin-bottom:16px;
  }
  .checklist{list-style:none;margin:12px 0 0;padding:0;}
  .checklist li{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;font-size:14.5px;}
  .checklist input{margin-top:3px;}
  details.model summary{cursor:pointer;color:var(--rouge-dark);font-size:14px;margin-top:8px;}
  details.model .model-text{margin-top:10px;font-size:14.5px;line-height:1.6;}

  footer.note{
    margin-top:60px;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:16px;
  }

  /* ---------- The Dictionary ---------- */
  .dict-link{
    display:inline-flex;align-items:center;gap:8px;
    margin-top:14px;padding:7px 12px;
    border:1px solid rgba(255,255,255,0.22);border-radius:6px;
    color:#fff;text-decoration:none;font-size:14px;font-weight:500;
  }
  .dict-link:hover{background:rgba(255,255,255,0.08);}
  .dict-link.active{background:rgba(174,37,48,0.3);border-color:rgba(240,185,189,0.55);}
  .dict-link:focus-visible{outline:2px solid #F0B9BD;outline-offset:2px;}
  .dict-intro{font-size:16px;color:var(--ink-soft);max-width:60ch;margin:0 0 20px;}
  .dict-search{
    border:1px solid var(--line);background:var(--panel);border-radius:6px;
    padding:14px 16px;margin-bottom:22px;display:grid;gap:12px;
  }
  .dict-modes{display:flex;flex-wrap:wrap;gap:6px;}
  .dict-mode{
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:20px;padding:6px 14px;font-size:13.5px;
  }
  .dict-mode[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;}
  .dict-row{display:flex;gap:8px;}
  .dict-row input{
    flex:1;min-width:0;padding:10px 12px;font:inherit;font-size:16px;
    border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);
  }
  .dict-row input:focus-visible{outline:2px solid var(--rouge);outline-offset:1px;}
  .dict-letters{display:flex;flex-wrap:wrap;gap:4px;}
  .dict-letters[hidden]{display:none;}
  .dict-letter{
    min-width:32px;padding:4px 6px;font-size:15px;
    border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);
  }
  .dict-letter:hover, .dict-mode:hover, .dict-chip:hover{border-color:var(--gold);}
  .dict-heading{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--navy);margin:18px 0 8px;}
  .dict-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .dict-chip{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:20px;padding:5px 12px;font-size:14px;
  }
  .dict-chip span{font-size:10.5px;color:var(--ink-soft);}
  .dict-course{list-style:none;margin:0 0 6px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);}
  .dict-course li{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:4px 14px;align-items:baseline;
    padding:8px 14px;border-bottom:1px solid var(--line-soft);font-size:14px;
  }
  .dict-course li:last-child{border-bottom:none;}
  .dict-course-fr{font-weight:600;}
  .dict-course-en{color:var(--ink-soft);}
  .dict-course-where{font-size:12.5px;white-space:nowrap;}
  .dict-status{color:var(--ink-soft);font-size:15px;margin:18px 0 10px;}
  .dict-entry{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;}
  .dict-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;}
  .dict-word{font-family:var(--serif);font-weight:600;font-size:30px;color:var(--navy);margin:0;}
  .dict-say{
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:20px;padding:4px 12px;font-size:13px;
  }
  .dict-pos{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--rouge-dark);margin:18px 0 6px;}
  .dict-senses{margin:0;padding-left:22px;font-size:15.5px;line-height:1.6;}
  .dict-senses > li{margin-bottom:8px;}
  .dict-examples{list-style:none;margin:6px 0 0;padding:0 0 0 12px;border-left:3px solid var(--paper-alt);}
  .dict-examples li{margin-bottom:4px;}
  .dict-examples .ex-fr{display:block;font-style:italic;}
  .dict-examples .ex-en{display:block;}
  .dict-source{font-size:12.5px;color:var(--ink-soft);margin-top:18px;}
  .dict-chip-inline{margin-left:6px;padding:1px 10px;font-size:13px;vertical-align:baseline;}
  .conj-facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;margin:0 0 4px;}
  .conj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:10px;}
  .conj-card{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 14px;}
  .conj-card h4{margin:0 0 6px;font-size:14px;color:var(--navy);display:flex;flex-direction:column;}
  .conj-card h4 span{font-family:var(--serif);font-style:italic;font-weight:400;font-size:13px;color:var(--ink-soft);}
  .conj-card ul{list-style:none;margin:0;padding:0;}
  .conj-card li{font-size:14.5px;padding:2px 0;cursor:pointer;border-radius:3px;}
  .conj-card li:hover{background:var(--paper-alt);}
  .conj-more{margin:6px 0 10px;}
  .conj-more summary{cursor:pointer;color:var(--rouge-dark);font-size:14px;margin-bottom:10px;}

  /* mobile */
  @media (max-width: 820px){
    body{flex-direction:column;}
    .dict-link{margin-top:8px;padding:5px 10px;font-size:13px;}

<script>
// The course is written in TypeScript (src/app.ts, kept off GitHub) and published only in
// encrypted form (#courseData above, written by src/build.sh) using "username|password". Signing in derives the key with PBKDF2 and
// decrypts it; Babel then strips the types and the result runs as a normal script.
(function(){
  const $ = (id) => document.getElementById(id);
  const ITERATIONS = 250000;              // must match src/build.sh
  const MARKER = '// french-course-v1';
  const KEY_STORE = 'french-unlock';
  const BABEL = 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js';
  let cipher = null;

  const hex = (u) => Array.from(u, x => x.toString(16).padStart(2, '0')).join('');
  const unhex = (s) => new Uint8Array(s.match(/../g).map(h => parseInt(h, 16)));

  // The encrypted course is built into this page (see #courseData), so nothing has to be
  // downloaded and the page also works when opened straight from a folder.
  async function getCipher(){
    if(cipher) return cipher;
    const b64 = $('courseData').textContent.trim();
    if(!b64) throw new Error('The course is missing from this page.');
    const bytes = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
    if(new TextDecoder().decode(bytes.slice(0, 8)) !== 'Salted__') throw new Error('The course data is damaged.');
    cipher = {salt: bytes.slice(8, 16), body: bytes.slice(16)};
    return cipher;
  }
  async function deriveBits(pass, salt){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256'}, base, 384));
  }
  async function unlock(bits, c){
    try{
      const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), {name: 'AES-CBC'}, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name: 'AES-CBC', iv: bits.slice(32, 48)}, key, c.body);
      const text = new TextDecoder().decode(plain);
      return text.startsWith(MARKER) ? text : null;
    }catch(e){
      return null;
    }
  }
  function loadBabel(){
    if(window.Babel) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = BABEL;
      s.onload = () => res();
      s.onerror = () => rej(new Error('Could not load the course. Check your internet connection.'));
      document.head.appendChild(s);
    });
  }
  async function launch(source){
    await loadBabel();
    const js = Babel.transform(source, {filename: 'app.ts', presets: ['typescript']}).code;
    $('gate').hidden = true;
    document.body.classList.remove('locked');
    const s = document.createElement('script');
    s.textContent = js;
    document.body.appendChild(s);
  }
  // Stay signed in on this device: the derived key (not the password) is remembered
  async function tryRemembered(){
    let saved = null;
    try{ saved = localStorage.getItem(KEY_STORE); }catch(e){}
    if(!saved) return false;
    try{
      const [saltHex, bitsHex] = saved.split(':');
      const c = await getCipher();
      if(saltHex !== hex(c.salt)) throw new Error('course was updated');
      const text = await unlock(unhex(bitsHex), c);
      if(!text) throw new Error('stale');
      await launch(text);
      return true;
    }catch(e){
      try{ localStorage.removeItem(KEY_STORE); }catch(_){}
      return false;
    }
  }
  function showError(msg){
    $('gateError').textContent = msg;
    $('gateError').hidden = false;
  }

  $('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('gateBtn');
    $('gateError').hidden = true;
    if(!window.crypto || !crypto.subtle){ showError('This browser can’t sign in here. Try Safari or Chrome.'); return; }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try{
      const c = await getCipher();
      const bits = await deriveBits($('gateUser').value.trim() + '|' + $('gatePass').value, c.salt);
      const text = await unlock(bits, c);
      if(!text){
        showError('That username or password isn’t right.');
        $('gatePass').value = '';
        $('gatePass').focus();
      }else{
        try{ localStorage.setItem(KEY_STORE, hex(c.salt) + ':' + hex(bits)); }catch(_){}
        await launch(text);
      }
    }catch(err){
      showError(err.message || 'Something went wrong. Please try again.');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  // QR code guest pass from the Study for Scholarships home page (same site, so same localStorage):
  // {key, expires}. While it lasts, the key opens #guestData; when it runs out the page locks again.
  const GUEST_STORE = 'scholarship-guest';
  async function tryGuest(){
    let pass = null;
    try{ pass = JSON.parse(localStorage.getItem(GUEST_STORE)); }catch(e){}
    if(!pass || !pass.key || !(pass.expires > Date.now())) return false;
    try{
      const bytes = Uint8Array.from(atob($('guestData').textContent.trim()), ch => ch.charCodeAt(0));
      const key = await crypto.subtle.importKey('raw', unhex(pass.key), {name: 'AES-CBC'}, false, ['decrypt']);
      const text = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-CBC', iv: bytes.slice(0, 16)}, key, bytes.slice(16)));
      if(!text.startsWith(MARKER)) return false;
      await launch(text);
    }catch(e){
      return false;
    }
    const pill = document.createElement('p');
    pill.textContent = 'Guest access until ' + new Date(pass.expires).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    pill.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;margin:0;padding:7px 14px;border-radius:999px;background:rgba(30,26,21,0.88);color:#F3E7C8;font:12.5px system-ui,sans-serif;';
    document.body.appendChild(pill);
    const check = () => { if(Date.now() >= pass.expires) location.reload(); };
    setInterval(check, 20000);
    document.addEventListener('visibilitychange', check);
    return true;
  }

  $('signOutBtn').addEventListener('click', () => {
    try{ localStorage.removeItem(KEY_STORE); localStorage.removeItem(GUEST_STORE); }catch(e){}
    location.reload();
  });

  (async () => (await tryRemembered()) || (await tryGuest()))().then(ok => {
    if(!ok){
      $('gateCard').classList.remove('pending');
      $('gateUser').focus({preventScroll: true});
    }
  });
})();
</script>
